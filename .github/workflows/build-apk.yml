name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest index.html into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kids-English-Adventure.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kids-English-Adventure-APK
          path: Kids-English-Adventure.apk
          retention-days: 90

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Kids English Adventure (Android APK)
          body: |
            Standalone offline Android APK for **Kids English Adventure (इंग्लिश सीखें और खेलें)**.
            - Works 100% offline with zero domain or URL required.
            - Includes native Android English Text-to-Speech pronunciation.
          files: Kids-English-Adventure.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
